models:
  - name: stg_process_metrics
    description: >
      収集時刻 × ホスト × pid で 1 行。raw.process_metrics の名前を正規化し、メモリを MB に換算し、
      二重読み込みによる重複を 1 行に絞ったもの。
    columns:
      - name: sample_key
        description: 収集時刻・ホスト名・pid の代理キー。staging で重複を排除しきれているかをここで見張る
        data_tests:
          - unique
          - not_null
      - name: collected_at_jst
        description: collected_at を日本時間に直したもの（表示用）
      - name: process_name
        description: 小文字化し .exe を落としたプロセス名。カテゴリの JOIN キーなので欠けると集計から漏れる
        data_tests:
          - not_null
      - name: status
        description: psutil のプロセス状態
        data_tests:
          - accepted_values:
              arguments:
                # 2026-10-14 に dbt show で確かめた Mac の実値。Windows の値は要確認
                values: [running, sleeping, zombie, idle]
      - name: memory_mb
        description: >
          常駐メモリ（RSS）の MB。権限がなく読めないシステムプロセスは null（Mac で約 3 割）。
          欠損は想定内なので not_null は付けない

  - name: stg_system_metrics
    description: 収集時刻 × ホストで 1 行。PC 全体のメモリを GB に換算し、起動からの時間を足したもの
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [collected_at, hostname]

unit_tests:
  - name: test_stg_process_metrics_normalizes_name_and_unit
    description: Windows の .exe と大文字を揃え、bytes を MB に換算し、同じ行の二重読み込みを 1 行に絞ること
    model: stg_process_metrics
    given:
      - input: source('raw', 'process_metrics')
        rows:
          - { collected_at: "2026-10-12 10:00:00+00", hostname: "pc", pid: 100, name: "Chrome.exe", status: "running", memory_rss: 1048576 }
          - { collected_at: "2026-10-12 10:00:00+00", hostname: "pc", pid: 100, name: "Chrome.exe", status: "running", memory_rss: 1048576 }
          - { collected_at: "2026-10-12 10:00:00+00", hostname: "pc", pid: 200, name: "kernel_task", status: "idle", memory_rss: null }
    expect:
      rows:
        - { pid: 100, process_name: "chrome", memory_mb: 1.0 }
        - { pid: 200, process_name: "kernel_task", memory_mb: null }

  - name: test_fct_process_memory_sums_then_averages
    description: 同名プロセスを 1 回の収集の中で合算してから、1 分の中で平均すること
    model: fct_process_memory
    given:
      - input: ref('stg_process_metrics')
        rows:
          # 10:00:00 の収集: chrome が 2 プロセス（100MB + 300MB）
          - { collected_at: "2026-10-12 01:00:00+00", collected_at_jst: "2026-10-12 10:00:00", hostname: "pc", process_name: "chrome", memory_mb: 100 }
          - { collected_at: "2026-10-12 01:00:00+00", collected_at_jst: "2026-10-12 10:00:00", hostname: "pc", process_name: "chrome", memory_mb: 300 }
          # 10:00:30 の収集: chrome が 1 プロセス（200MB）
          - { collected_at: "2026-10-12 01:00:30+00", collected_at_jst: "2026-10-12 10:00:30", hostname: "pc", process_name: "chrome", memory_mb: 200 }
      - input: ref('int_hosts_resolved')
        rows:
          - { hostname: "pc", device_name: "my-pc" }
    expect:
      rows:
        # (400 + 200) / 2 = 300。プロセス単位で平均すると (100 + 300 + 200) / 3 = 200 になってしまう
        - { snapshots: 2, avg_process_count: 1.5, avg_memory_mb: 300.0, max_memory_mb: 400.0 }
