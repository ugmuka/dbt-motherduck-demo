sources:
  - name: raw
    description: collect.py が書き込む生データ。psutil の値をそのまま持つ
    schema: raw
    # v2 では freshness と loaded_at_field は config の下に書く（直下に書くと dbt1060 で無視される）
    config:
      loaded_at_field: collected_at
      freshness:
        warn_after: { count: 30, period: minute }
        error_after: { count: 2, period: hour }
    tables:
      - name: process_metrics
        description: 収集時点ごとの全プロセスのメモリと CPU
      - name: system_metrics
        description: 収集時点ごとの PC 全体のメモリと CPU
